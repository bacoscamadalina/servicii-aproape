name: CI

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  django-postgresql:
    name: Django + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/casa_mea
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      CASAMEA_DB_ENGINE: postgresql
      CASAMEA_POSTGRES_DB: casamea_ci
      CASAMEA_POSTGRES_USER: postgres
      CASAMEA_POSTGRES_PASSWORD: postgres
      CASAMEA_POSTGRES_HOST: 127.0.0.1
      CASAMEA_POSTGRES_PORT: "5432"
      CASAMEA_SECRET_KEY: ci-only-secret-key-that-is-never-used-outside-the-disposable-runner
      CASAMEA_DOMAIN: ci.example.test
      CASAMEA_EMAIL_HOST: smtp.example.test
      CASAMEA_EMAIL_HOST_USER: ci-smtp-user
      CASAMEA_EMAIL_HOST_PASSWORD: ci-smtp-password
      CASAMEA_DEFAULT_FROM_EMAIL: ServiciiAproape CI <ci@example.test>
      CASAMEA_LEGAL_OPERATOR_NAME: Operator sintetic CI
      CASAMEA_LEGAL_OPERATOR_ADDRESS: Adresa sintetica CI
      CASAMEA_PRIVACY_EMAIL: privacy@example.test
      CASAMEA_RETENTION_UNVERIFIED_CLAIM_DAYS: "30"
      CASAMEA_RETENTION_REJECTED_CLAIM_DAYS: "90"
      CASAMEA_RETENTION_CLOSED_REPORT_DAYS: "365"
      CASAMEA_RETENTION_CLOSED_DATA_REQUEST_DAYS: "1095"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: casamea_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casamea_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/casa_mea/requirements-cloud.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt

      - name: Verify installed dependency integrity
        run: python -m pip check

      - name: Run Django system checks
        run: python manage.py check

      - name: Run fail-closed production checks
        run: python manage.py check --deploy --settings=config.production

      - name: Reject missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 1

      - name: Run JavaScript tests
        run: node --test tests/locations-race.test.cjs

  docker-contracts:
    name: Docker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/casa_mea
    env:
      CASAMEA_SECRET_KEY: ci-only-secret-key-that-is-never-used-outside-the-disposable-runner
      CASAMEA_DOMAIN: ci.example.test
      CASAMEA_POSTGRES_PASSWORD: ci-postgres-password
      CASAMEA_EMAIL_HOST: smtp.example.test
      CASAMEA_EMAIL_HOST_USER: ci-smtp-user
      CASAMEA_EMAIL_HOST_PASSWORD: ci-smtp-password
      CASAMEA_DEFAULT_FROM_EMAIL: ServiciiAproape CI <ci@example.test>
      CASAMEA_LEGAL_OPERATOR_NAME: Operator sintetic CI
      CASAMEA_LEGAL_OPERATOR_ADDRESS: Adresa sintetica CI
      CASAMEA_PRIVACY_EMAIL: privacy@example.test
      CASAMEA_ADMIN_USERNAME: ci-admin
      CASAMEA_ADMIN_EMAIL: ci-admin@example.test
      CASAMEA_ADMIN_PASSWORD: CI-only-administrator-password-2026!
      CASAMEA_RETENTION_UNVERIFIED_CLAIM_DAYS: "30"
      CASAMEA_RETENTION_REJECTED_CLAIM_DAYS: "90"
      CASAMEA_RETENTION_CLOSED_REPORT_DAYS: "365"
      CASAMEA_RETENTION_CLOSED_DATA_REQUEST_DAYS: "1095"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate portable Compose files
        run: |
          docker compose config --quiet
          docker compose -f ../../docker-compose.yml config --quiet

      - name: Validate production Compose file
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build production image
        run: docker build --target production --tag serviciiaproape-production:ci .

      - name: Verify production image runs as the application user
        run: docker image inspect --format '{{.Config.User}}' serviciiaproape-production:ci | grep --fixed-strings --line-regexp '10001:10001'

      - name: Verify production-only database tooling boundary
        run: docker run --rm --entrypoint psql serviciiaproape-production:ci --version

      - name: Build packaged preview image
        run: docker build --target preview --tag serviciiaproape-preview:ci .

      - name: Verify preview image is unprivileged and excludes database tooling
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' serviciiaproape-preview:ci)" = "10001:10001"
          docker run --rm --entrypoint sh serviciiaproape-preview:ci -c '! command -v psql'

      - name: Start packaged preview through app Compose
        env:
          PREVIEW_HOST_PORT: 127.0.0.1:18000
        run: docker compose up --build --detach

      - name: Verify Romanian and English preview routes
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/ > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:18000/en/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color web
          exit 1

      - name: Verify packaged preview rejects writes
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:18000/)" = "405"

      - name: Remove preview container
        if: always()
        run: docker compose down

      - name: Start persistent managed-cloud stack
        env:
          APP_HOST_PORT: 127.0.0.1:18001
        run: docker compose -f ../../docker-compose.yml up --build --detach

      - name: Verify managed-cloud database, catalogue and workflows
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              --header 'Host: ci.example.test' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18001/ > /tmp/managed-home.html; then
              grep --fixed-strings '/pentru-profesionisti/' /tmp/managed-home.html
              curl --fail --silent --show-error \
                --header 'Host: ci.example.test' \
                --header 'X-Forwarded-Proto: https' \
                'http://127.0.0.1:18001/firme/3950/?county=Ia%C8%99i&locality=95079&category=constructii' \
                | grep --fixed-strings '/revendica/'
              docker compose -f ../../docker-compose.yml exec -T web \
                python manage.py shell --command \
                "from django.contrib.auth import get_user_model; from services.models import BusinessIdentity; assert BusinessIdentity.objects.count() == 72881; assert get_user_model().objects.filter(username='ci-admin', is_superuser=True).exists()"
              exit 0
            fi
            sleep 1
          done
          docker compose -f ../../docker-compose.yml logs --no-color
          exit 1

      - name: Verify managed-cloud restart preserves state
        run: |
          docker compose -f ../../docker-compose.yml restart web
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              --header 'Host: ci.example.test' \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:18001/admin/login/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f ../../docker-compose.yml logs --no-color web
          exit 1

      - name: Remove managed-cloud containers and disposable volumes
        if: always()
        run: docker compose -f ../../docker-compose.yml down --volumes

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/casa_mea
    env:
      CASAMEA_E2E_BASE_URL: http://127.0.0.1:18002
      CASAMEA_E2E_ARTIFACT_DIR: test-artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/casa_mea/requirements-e2e.txt

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-e2e.txt

      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Build packaged preview image
        run: docker build --target preview --tag serviciiaproape-preview:e2e .

      - name: Start packaged preview on localhost
        run: >-
          docker run --detach --name serviciiaproape-preview-e2e
          --publish 127.0.0.1:18002:8000 serviciiaproape-preview:e2e

      - name: Wait for packaged preview
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18002/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs serviciiaproape-preview-e2e
          exit 1

      - name: Run desktop and mobile browser journeys
        run: python tests/e2e_preview.py

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-e2e-diagnostics
          path: apps/casa_mea/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove preview container
        if: always()
        run: docker rm --force serviciiaproape-preview-e2e || true
